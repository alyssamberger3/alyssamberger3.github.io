# Your experiences
experiences:
- company:
    name: OCLC
    url: "https://www.oclc.org/en/home.html"
    location: Columbus, Ohio
    logo: /images/sections/experiences/OCLC.png
    darkLogo: /images/sections/experiences/OCLC.png
    overview: OCLC is a global library organization that provides shared technology services, original research, and community programs for its membership and the library community at large.
  positions:
  - designation: UX Accessibility Intern
    start: May 2025
    responsibilities:
    - Assessed accessibility compliance of OCLC products against WCAG 2.2 standards, with focus on landmark EU (2025) and US (2027) digital accessibility regulations.
    - Generated VPAT reports, managed Jira tickets, and re-evaluated product accessibility post-remediation to verify resolution of identified barriers.
    - Led UX Design and Research efforts on a capstone project focused on introducing AI applications, working closely with Cybersecurity, Business Analysis, and Information Security teams.
- company:
    name: Purdue University Residences
    url: "https://www.housing.purdue.edu/campus-living/get-involved/work-with-us/ra.html"
    location: West Lafayette, Indiana
    logo: /images/sections/education/Purdue.png
    darkLogo: /images/sections/education/Purdue-Dark.png
    overview: Purdue University Residences provides on-campus housing and community living services for Purdue students, encompassing residence hall operations, staff training, and resident support programs.
  positions:
  - designation: Accessibility Compliance Intern
    start: May 2026
    responsibilities:
    - Remediated protocol manuals, onboarding materials, and professional staff documentation to meet WCAG 2.2 and Section 508 standards.
    - Audited and provided remediation guidance for the Purdue University Residences website, identifying accessibility barriers and recommending compliant design solutions.
    - Served as an accessibility subject-matter expert for housing staff, advising on equitable communication practices and inclusive document creation workflows.
- company:
    name: Purdue University – Center for Instructional Excellence
    url: "https://www.purdue.edu/cie/"
    location: West Lafayette, Indiana
    logo: /images/sections/education/Purdue.png
    darkLogo: /images/sections/education/Purdue-Dark.png
    overview: The Center for Instructional Excellence supports Purdue faculty and staff in delivering effective, accessible instruction, including compliance with digital accessibility requirements for course materials.
  positions:
  - designation: Innovative Learning Support Team Lead
    start: Oct 2025
    responsibilities:
    - Supported the Student Accessibility Support Team in meeting the Department of Justice's updated ADA Title II digital accessibility requirements campus-wide.
    - Audited student-facing digital and web instructional materials for WCAG 2.2 and Section 508 compliance; guided faculty on accessible course design best practices.
- company:
    name: Purdue University Residences – Windsor Halls
    url: "https://www.housing.purdue.edu/campus-living/get-involved/work-with-us/ra.html"
    location: West Lafayette, Indiana
    logo: /images/sections/education/Purdue.png
    darkLogo: /images/sections/education/Purdue-Dark.png
    overview: Resident Assistants (RAs) foster student learning and success by supporting social and intellectual growth of residents while they live and learn on campus.
  positions:
  - designation: Windsor Halls Resident Assistant
    start: Aug 2025
    responsibilities:
    - Built community among 40+ residents through daily engagement and 32 annual programs, managing budgets and supporting resident wellbeing.
    - Enforced residential policies and supported residents through challenges using strong interpersonal communication and problem-solving skills.
